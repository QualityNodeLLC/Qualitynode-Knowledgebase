name: qualitynode_knowledgebase
description: QualityNode Knowledgebase - Game server hosting documentation
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.10.0

dependencies:
  web: ^1.1.1
  yaml: ^3.1.3
  arcane_jaspr:
    path: /Users/brianfopiano/Developer/RemoteGit/ArcaneArts/arcane_jaspr
  # arcane_jaspr:
  #   git:
  #     url: https://github.com/ArcaneArts/arcane_jaspr
  #     ref: master
  arcane_inkwell:
    path: /Users/brianfopiano/Developer/RemoteGit/ArcaneArts/arcane_inkwell
  # arcane_inkwell:
  #   git:
  #     url: https://github.com/ArcaneArts/arcane_inkwell
  #     ref: master

  jaspr: ^0.22.1
  jaspr_content: ^0.4.5

dev_dependencies:
  build_runner: ^2.10.4
  build_web_compilers: ^4.4.6
  jaspr_builder: ^0.22.1
  lints: ^6.0.0

jaspr:
  mode: static

scripts:
  # Content validation
  validate: dart run tool/validate_content.dart
  validate_fix: dart run tool/validate_content.dart --fix --verbose

  # Development
  serve: jaspr serve

  # Build (validates content first, then builds)
  build: dart run tool/validate_content.dart --fix && jaspr build
  build_strict: dart run tool/validate_content.dart --strict && jaspr build

  # Deployment
  deploy: dart run tool/validate_content.dart --fix && jaspr build && firebase deploy --only hosting --project qualitynode-1b4a8

  # Cleanup
  clean: jaspr clean
