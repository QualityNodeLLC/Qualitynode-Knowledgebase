name: qualitynode_knowledgebase
description: QualityNode Knowledgebase - Game server hosting documentation
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.10.0

dependencies:
  web: ^1.1.1
  yaml: ^3.1.3
  arcane_jaspr:
    path: .deps/arcane_jaspr
  arcane_jaspr_neon:
    path: .deps/arcane_jaspr/packages/arcane_jaspr_neon
  arcane_lexicon:
    path: .deps/arcane_lexicon

  jaspr: ^0.23.1
  jaspr_content: ^0.5.2

dev_dependencies:
  build_runner: ^2.11.1
  build_web_compilers: ^4.4.14
  jaspr_builder: ^0.23.1
  lints: ^6.1.0

dependency_overrides:
  arcane_jaspr:
    path: .deps/arcane_jaspr
  arcane_lexicon:
    path: .deps/arcane_lexicon

jaspr:
  mode: static
  port: 8092

scripts:
  # Content validation
  validate: dart run tool/validate_content.dart
  validate_fix: dart run tool/validate_content.dart --fix --verbose

  # Development
  serve: jaspr serve

  # Build (validates content first, then builds)
  build: dart run tool/validate_content.dart --fix && jaspr build
  build_strict: dart run tool/validate_content.dart --strict && jaspr build

  # Deployment
  deploy: dart run tool/validate_content.dart --fix && jaspr build && firebase deploy --only hosting --project qualitynode-1b4a8

  # Cleanup
  clean: jaspr clean
