name: Validate Content and Deploy

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-and-update:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip ci]') && !contains(github.event.head_commit.message, '[meta-master]')"
    outputs:
      changes_made: ${{ steps.check-changes.outputs.has_changes }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Get dependencies (scripts)
        working-directory: scripts
        run: dart pub get

      - name: Switch to remote dependencies
        run: dart scripts/switch_dependencies.dart remote

      - name: Get dependencies
        run: dart pub get

      - name: Validate and fix content metadata
        run: dart run tool/validate_content.dart --fix --verbose

      - name: Check for changes
        id: check-changes
        run: |
          if git diff --quiet; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit metadata updates
        if: steps.check-changes.outputs.has_changes == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add -A
          git commit -m "Update content metadata [meta-master]"
          git push

  build-and-deploy:
    runs-on: ubuntu-latest
    needs: validate-and-update
    if: always() && !cancelled() && !contains(github.event.head_commit.message, '[skip ci]')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Pull latest changes
        run: git pull origin ${{ github.ref_name }} || true

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install Jaspr CLI
        run: dart pub global activate jaspr_cli

      - name: Add pub cache to PATH
        run: echo "$HOME/.pub-cache/bin" >> $GITHUB_PATH

      - name: Get dependencies (scripts)
        working-directory: scripts
        run: dart pub get

      - name: Switch to remote dependencies
        run: dart scripts/switch_dependencies.dart remote

      - name: Get dependencies
        run: flutter pub get

      - name: Generate search index
        run: dart run tool/generate_search_index.dart

      - name: Build Jaspr app
        run: jaspr build

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          channelId: live
          projectId: qualitynode-1b4a8
