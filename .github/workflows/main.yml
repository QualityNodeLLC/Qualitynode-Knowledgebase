name: Validate Content and Deploy

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-and-update:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip ci]') && !contains(github.event.head_commit.message, '[meta-master]')"
    outputs:
      changes_made: ${{ steps.check-changes.outputs.has_changes }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout pinned arcane_jaspr
        uses: actions/checkout@v4
        with:
          repository: ArcaneArts/arcane_jaspr
          ref: 1d139808269cd41f11cc0a61ef3b14c575921799
          path: .deps/arcane_jaspr

      - name: Checkout pinned arcane_lexicon
        uses: actions/checkout@v4
        with:
          repository: ArcaneArts/arcane_lexicon
          ref: c9d5f077238aeffdc882a923034badd5e2663259
          path: .deps/arcane_lexicon

      - name: Setup Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Get dependencies (scripts)
        working-directory: scripts
        run: dart pub get

      - name: Switch to remote dependencies
        run: dart scripts/switch_dependencies.dart remote

      - name: Get dependencies
        run: dart pub get

      - name: Validate and fix content metadata
        run: dart run tool/validate_content.dart --fix --verbose

      - name: Check for changes
        id: check-changes
        run: |
          if git diff --quiet; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit metadata updates
        if: steps.check-changes.outputs.has_changes == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add -A
          git commit -m "Update content metadata [meta-master]"
          git push

  build-and-deploy:
    runs-on: ubuntu-latest
    needs: validate-and-update
    if: always() && !cancelled() && !contains(github.event.head_commit.message, '[skip ci]')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Checkout pinned arcane_jaspr
        uses: actions/checkout@v4
        with:
          repository: ArcaneArts/arcane_jaspr
          ref: 1d139808269cd41f11cc0a61ef3b14c575921799
          path: .deps/arcane_jaspr

      - name: Checkout pinned arcane_lexicon
        uses: actions/checkout@v4
        with:
          repository: ArcaneArts/arcane_lexicon
          ref: c9d5f077238aeffdc882a923034badd5e2663259
          path: .deps/arcane_lexicon

      - name: Pull latest changes
        run: git pull origin ${{ github.ref_name }} || true

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install Jaspr CLI
        run: dart pub global activate jaspr_cli 0.23.1

      - name: Add pub cache to PATH
        run: echo "$HOME/.pub-cache/bin" >> $GITHUB_PATH

      - name: Get dependencies (scripts)
        working-directory: scripts
        run: dart pub get

      - name: Switch to remote dependencies
        run: dart scripts/switch_dependencies.dart remote

      - name: Get dependencies
        run: flutter pub get

      - name: Generate search index
        run: dart run tool/generate_search_index.dart

      - name: Build Jaspr app
        run: jaspr build

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          # Node 22.23.0 has a keep-alive socket regression that breaks
          # firebase-tools' OAuth token fetch ("Premature close", surfaced as a
          # bogus "Failed to authenticate"). 22.23.1 is the patched release. This
          # deploy job previously had no Node setup, so it used the runner's
          # broken default; a bare "22" would still resolve to the cached 22.23.0.
          node-version: 22.23.1

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Deploy to Firebase Hosting
        # firebase.json sets site=qualitynode-docs, so plain `--only hosting`
        # targets it. firebase-tools reads the credentials google-github-actions/auth
        # exports as GOOGLE_APPLICATION_CREDENTIALS. 15.17.0 predates the 15.22.3
        # double-release bug. Mirrors the working qualitynode_web deploy.
        run: npx --yes firebase-tools@15.17.0 deploy --only hosting --project qualitynode-1b4a8 --non-interactive
