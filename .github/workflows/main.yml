name: Update Frontmatter and Deploy

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-frontmatter:
    runs-on: ubuntu-latest
    # Skip frontmatter update if commit was made by this action
    if: "!contains(github.event.head_commit.message, '[skip ci]') && !contains(github.event.head_commit.message, '[meta-master]')"
    outputs:
      changes_made: ${{ steps.check-changes.outputs.has_changes }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Get changed markdown files
        id: changed-files
        run: |
          CHANGED_FILES=$(git diff --name-only HEAD~1 HEAD -- 'content/**/*.md' 2>/dev/null || echo "")
          echo "files<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGED_FILES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          echo "Changed files: $CHANGED_FILES"

      - name: Update frontmatter
        run: |
          COMMIT_DATE=$(git log -1 --format='%Y-%m-%d')
          COMMIT_AUTHOR=$(git log -1 --format='%an')

          echo "Commit date: $COMMIT_DATE"
          echo "Commit author: $COMMIT_AUTHOR"

          while IFS= read -r file; do
            if [ -z "$file" ]; then
              continue
            fi

            if [ ! -f "$file" ]; then
              echo "File not found (possibly deleted): $file"
              continue
            fi

            echo "Processing: $file"

            if ! head -1 "$file" | grep -q "^---"; then
              echo "  No frontmatter found, skipping"
              continue
            fi

            TEMP_FILE=$(mktemp)

            awk -v date="$COMMIT_DATE" -v author="$COMMIT_AUTHOR" '
              BEGIN { in_frontmatter = 0; frontmatter_count = 0; date_updated = 0; author_updated = 0 }

              /^---$/ {
                frontmatter_count++
                if (frontmatter_count == 1) {
                  in_frontmatter = 1
                  print
                  next
                } else if (frontmatter_count == 2) {
                  if (!date_updated) {
                    print "date: " date
                  }
                  if (!author_updated) {
                    print "author: " author
                  }
                  in_frontmatter = 0
                  print
                  next
                }
              }

              in_frontmatter && /^date:/ {
                print "date: " date
                date_updated = 1
                next
              }

              in_frontmatter && /^author:/ {
                print "author: " author
                author_updated = 1
                next
              }

              { print }
            ' "$file" > "$TEMP_FILE"

            mv "$TEMP_FILE" "$file"

            echo "  Updated: date=$COMMIT_DATE, author=$COMMIT_AUTHOR"

          done <<< "${{ steps.changed-files.outputs.files }}"

      - name: Check for changes
        id: check-changes
        run: |
          if git diff --quiet; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit frontmatter updates
        if: steps.check-changes.outputs.has_changes == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add -A
          git commit -m "Update frontmatter date and author [meta-master]"
          git push

  build-and-deploy:
    runs-on: ubuntu-latest
    needs: update-frontmatter
    if: always() && !cancelled() && !contains(github.event.head_commit.message, '[skip ci]')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Pull latest changes
        run: git pull origin ${{ github.ref_name }} || true

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install Jaspr CLI
        run: dart pub global activate jaspr_cli

      - name: Add pub cache to PATH
        run: echo "$HOME/.pub-cache/bin" >> $GITHUB_PATH

      - name: Get dependencies
        run: flutter pub get

      - name: Build Jaspr app
        run: jaspr build

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          channelId: live
          projectId: qualitynode-1b4a8
