name: Validate Content and Deploy

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-and-update:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip ci]') && !contains(github.event.head_commit.message, '[meta-master]')"
    outputs:
      changes_made: ${{ steps.check-changes.outputs.has_changes }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout pinned arcane_jaspr
        uses: actions/checkout@v4
        with:
          repository: ArcaneArts/arcane_jaspr
          ref: edd4d7f45dcefe647f0792902acc1808cb47477b
          path: .deps/arcane_jaspr

      - name: Checkout pinned arcane_lexicon
        uses: actions/checkout@v4
        with:
          repository: ArcaneArts/arcane_lexicon
          ref: 2c243c21aeac2903118084952217bc1f4f675c49
          path: .deps/arcane_lexicon

      - name: Setup Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Get dependencies (scripts)
        working-directory: scripts
        run: dart pub get

      - name: Switch to remote dependencies
        run: dart scripts/switch_dependencies.dart remote

      - name: Get dependencies
        run: dart pub get

      - name: Validate and fix content metadata
        run: dart run tool/validate_content.dart --fix --verbose

      - name: Check for changes
        id: check-changes
        run: |
          if git diff --quiet; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit metadata updates
        if: steps.check-changes.outputs.has_changes == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add -A
          git commit -m "Update content metadata [meta-master]"
          git push

  build-and-deploy:
    runs-on: ubuntu-latest
    needs: validate-and-update
    if: always() && !cancelled() && !contains(github.event.head_commit.message, '[skip ci]')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Checkout pinned arcane_jaspr
        uses: actions/checkout@v4
        with:
          repository: ArcaneArts/arcane_jaspr
          ref: edd4d7f45dcefe647f0792902acc1808cb47477b
          path: .deps/arcane_jaspr

      - name: Checkout pinned arcane_lexicon
        uses: actions/checkout@v4
        with:
          repository: ArcaneArts/arcane_lexicon
          ref: 2c243c21aeac2903118084952217bc1f4f675c49
          path: .deps/arcane_lexicon

      - name: Pull latest changes
        run: git pull origin ${{ github.ref_name }} || true

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install Jaspr CLI
        run: dart pub global activate jaspr_cli 0.23.1

      - name: Add pub cache to PATH
        run: echo "$HOME/.pub-cache/bin" >> $GITHUB_PATH

      - name: Get dependencies (scripts)
        working-directory: scripts
        run: dart pub get

      - name: Switch to remote dependencies
        run: dart scripts/switch_dependencies.dart remote

      - name: Get dependencies
        run: flutter pub get

      - name: Run source and content policy tests
        run: dart test

      - name: Generate search index
        run: dart run tool/generate_search_index.dart

      - name: Validate published content
        run: dart run tool/validate_content.dart --strict

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          # Node 22.23.0 has a keep-alive socket regression that breaks
          # firebase-tools' OAuth token fetch. Keep the patched release exact.
          node-version: 22.23.1

      - name: Install browser policy dependencies
        working-directory: test/browser
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Build Jaspr app
        run: jaspr build

      - name: Check Knowledgebase browser design policy
        run: |
          set -euo pipefail

          browser_log="$RUNNER_TEMP/knowledgebase-browser-policy-server.log"
          npm --prefix test/browser run serve-build -- --listen 8899 >"$browser_log" 2>&1 &
          browser_server_pid=$!

          cleanup() {
            kill "$browser_server_pid" 2>/dev/null || true
            wait "$browser_server_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          for attempt in {1..60}; do
            if curl --fail --silent --show-error http://127.0.0.1:8899/ >/dev/null; then
              break
            fi
            if ! kill -0 "$browser_server_pid" 2>/dev/null; then
              cat "$browser_log"
              exit 1
            fi
            if [[ "$attempt" == "60" ]]; then
              cat "$browser_log"
              exit 1
            fi
            sleep 1
          done

          BASE_URL=http://127.0.0.1:8899 npm --prefix test/browser run design-policy

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Deploy to Firebase Hosting
        # firebase.json sets site=qualitynode-docs, so plain `--only hosting`
        # targets it. firebase-tools reads the credentials google-github-actions/auth
        # exports as GOOGLE_APPLICATION_CREDENTIALS. 15.17.0 predates the 15.22.3
        # double-release bug. Mirrors the working qualitynode_web deploy.
        run: npx --yes firebase-tools@15.17.0 deploy --only hosting --project qualitynode-1b4a8 --non-interactive
